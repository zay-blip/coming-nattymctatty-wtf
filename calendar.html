<script>
function clean(s){return String(s).replace(/\s+/g,'')}
var files=['media/mobile/calendar.0.txt','media/mobile/calendar.1.txt','media/mobile/calendar.2.txt','media/mobile/calendar.3.txt','media/mobile/calendar.4.txt','media/mobile/calendar.5.txt','media/mobile/calendar.6.txt'];
Promise.all(files.map(function(u){return fetch(u+'?v=20260919c').then(function(r){if(!r.ok)throw new Error(u);return r.text();})}))
.then(function(p){document.getElementById('shot').src='data:image/jpeg;base64,'+p.map(clean).join('');})
.catch(function(){document.body.insertAdjacentHTML('beforeend','<p style="color:#fff;text-align:center;padding:2rem">Image failed to load. Hard refresh.</p>');});
</script>
